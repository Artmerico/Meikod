<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pixathon — MeikodRJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4f9a;--orange:#ff9a4a;--purple:#8b3dff;--cash:#6fdc8c;--teal:#3fd0d4;--gold:#e9c46a;--slab:rgba(16,10,24,var(--op,.88));--cut:18px}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Barlow,system-ui,sans-serif;color:#fff}
body.bg{background:#000 url(../preview.jpg) 0 0/1920px 1080px no-repeat}
#w{position:absolute;transform-origin:0 0}

/* ---------- peça comum ---------- */
.slab{position:relative;background:var(--slab);overflow:hidden;clip-path:polygon(0 0,100% 0,calc(100% - var(--cut)) 100%,0 100%)}
.slab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--pink),var(--orange))}
.slab::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),linear-gradient(90deg,rgba(255,79,154,.10),transparent 55%)}
.lbl{font:800 15px/1 "Barlow Condensed";letter-spacing:.32em;text-transform:uppercase;color:#ffd0e4}
.lbl b{background:linear-gradient(90deg,var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{font:400 64px/1 Anton,Impact,sans-serif;letter-spacing:.02em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 35%,#ffc3dd 62%,var(--orange) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(120,20,70,.55)) drop-shadow(0 0 14px rgba(255,79,154,.35));white-space:nowrap}
.clock .u{display:inline-block;min-width:1.05em;text-align:center}
.clock .c{opacity:.75;margin:0 .02em}
.paused .clock{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.ended .clock{background:linear-gradient(180deg,#fff,var(--pink));-webkit-background-clip:text;background-clip:text}
.info{position:relative;overflow:hidden;height:28px}
.info .it{position:absolute;inset:0;display:flex;align-items:center;gap:9px;white-space:nowrap;font:600 19px/1 "Barlow Condensed";letter-spacing:.04em;color:#e9e2f2;animation:infoIn .55s cubic-bezier(.2,.9,.25,1) both}
.info .it.out{animation:infoOut .4s ease-in forwards}
@keyframes infoIn{from{transform:translateY(100%);opacity:0}}
@keyframes infoOut{to{transform:translateY(-100%);opacity:0}}
.info .k{flex:none;font:800 13px/1 "Barlow Condensed";letter-spacing:.14em;padding:4px 8px 3px;color:#170a14;background:var(--kc,var(--pink));clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%);padding-right:11px}
.info .v{color:var(--vc,#fff);font-weight:800}
.info .t{overflow:hidden;text-overflow:ellipsis}

/* ---------- layout BARRA (embaixo da câmera) ---------- */
.bar{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:16px;row-gap:6px;padding:10px calc(var(--cut) + 16px) 9px 20px}
.bar .head{display:flex;flex-direction:column;gap:6px;flex:none}
.bar .info{grid-column:1/-1;height:24px;border-top:1px solid rgba(255,255,255,.08);padding-top:2px}
.bar .info .it{font-size:17px}
.bar .head .sc{font:400 26px/0.9 Yellowtail,cursive;color:#fff;text-shadow:0 0 12px rgba(255,79,154,.6)}
.bar .clock{font-size:58px;text-align:right}
/* ---------- layout CARD (ao lado) ---------- */
.card{width:100%;padding:16px calc(var(--cut) + 14px) 16px 22px;display:flex;flex-direction:column;gap:10px}
.card .head{display:flex;justify-content:space-between;align-items:baseline}
.card .head .sc{font:400 30px/0.9 Yellowtail,cursive;color:#fff;text-shadow:0 0 12px rgba(255,79,154,.6)}
.card .clock{font-size:78px;text-align:center}
.card .rules{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card .rules div{display:flex;justify-content:space-between;gap:6px;padding:6px 9px;background:rgba(255,255,255,.05);font:700 15px/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:#d9d1e4}
.card .rules div b{color:var(--orange)}
.nor .rules{display:none}

/* ---------- +tempo / desafio ---------- */
#pops{position:absolute;left:0;right:0;top:100%;margin-top:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.pop{display:flex;align-items:center;gap:10px;padding:7px 26px 7px 12px;background:var(--slab);clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);
  font:700 19px/1 "Barlow Condensed";letter-spacing:.03em;animation:popIn .5s cubic-bezier(.2,1.3,.4,1) both, popOut .4s ease-in 4.6s forwards;border-left:4px solid var(--pc,var(--cash))}
.pop .p{font:400 24px/1 Anton;color:var(--pc,var(--cash))}
.pop .n{color:#fff;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .d{color:#b9b0c6;font-weight:600}
@keyframes popIn{from{transform:translateX(-30px);opacity:0}}
@keyframes popOut{to{transform:translateY(-8px);opacity:0}}
.flash .clock{animation:flash .7s ease-out}
@keyframes flash{0%{filter:drop-shadow(0 0 0 #fff) brightness(2)}100%{filter:drop-shadow(0 2px 0 rgba(120,20,70,.55)) drop-shadow(0 0 14px rgba(255,79,154,.35))}}

/* banner de desafio */
#ban{position:absolute;left:0;right:0;bottom:100%;margin-bottom:8px;display:none}
#ban.on{display:block;animation:popIn .5s cubic-bezier(.2,1.3,.4,1) both}
#ban .slab{padding:10px calc(var(--cut) + 16px) 11px 20px}
#ban .slab::before{background:linear-gradient(180deg,var(--gold),var(--orange))}
#ban .l1{font:800 14px/1 "Barlow Condensed";letter-spacing:.3em;color:var(--gold)}
#ban .l2{font:700 24px/1.15 "Barlow Condensed";margin-top:5px}
#ban .l2 b{color:var(--gold)}
</style>
</head>
<body>
<div id="w"><div id="ban"><div class="slab"><div class="l1">★ DESAFIO ATIVADO</div><div class="l2" id="banT"></div></div></div><div id="box"></div><div id="pops"></div></div>
<script>
/* ===== configuração vem toda pelo link (o painel gera) ===== */
const P=new URLSearchParams(location.search);
const num=(k,d)=>P.has(k)&&P.get(k)!==''&&!isNaN(+P.get(k))?+P.get(k):d;
const C={
  canal:(P.get('canal')||'meikodrj').toLowerCase().replace(/[^a-z0-9_]/g,''),
  tk:P.get('tk')||'', sid:P.get('sid')||'1',
  ini:num('ini',120), max:num('max',0),             // minutos
  sub:num('s',5), gift:num('g',5), bits:num('b',1), dv:num('dv',10), dm:num('dm',2),  // regras
  lay:P.get('lay')==='c'?'c':'b', x:num('x',1401), y:num('y',418), w:num('w',519), k:num('k',1), op:num('op',.88),
  ir:P.get('ir')!=='0', ic:P.get('ic')!=='0', demo:P.get('demo')==='1'
};
let CH=[];try{CH=JSON.parse(decodeURIComponent(escape(atob((P.get('ch')||'').replace(/-/g,'+').replace(/_/g,'/')))))||[]}catch(e){CH=[]}
if(P.get('bg')==='1')document.body.classList.add('bg');
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>'R$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:+v%1?2:0,maximumFractionDigits:2});
const mtxt=m=>m>=60&&m%60===0?'+'+m/60+'h':'+'+m+' min';

/* ===== layout ===== */
const W=$('#w'),box=$('#box');
Object.assign(W.style,{left:C.x+'px',top:C.y+'px',width:C.w+'px',transform:`scale(${C.k})`});
W.style.setProperty('--op',C.op);
const RULES=[['SUB',C.sub],['GIFT',C.gift],['100 BITS',C.bits],[brl(C.dv),C.dm]].filter(r=>r[1]>0);
if(C.lay==='b') box.innerHTML='<div class="slab bar"><div class="head"><div class="lbl"><b>PIXATHON</b></div><div class="sc">MeikodRJ</div></div><div class="clock" id="clk"></div><div class="info" id="info"></div></div>';
else{box.innerHTML='<div class="slab card'+(C.ir?'':' nor')+'"><div class="head"><div class="lbl"><b>PIXATHON</b></div><div class="sc">MeikodRJ</div></div><div class="clock" id="clk"></div>'+
  '<div class="rules">'+RULES.map(r=>`<div>${r[0]}<b>${mtxt(r[1])}</b></div>`).join('')+'</div><div class="info" id="info"></div></div>'}

/* ===== estado do tempo (fica salvo no próprio OBS) ===== */
const KEY='subathon.'+C.canal+'.'+C.sid;
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||C.demo)S={end:Date.now()+C.ini*60000,paused:null};
const save=()=>{if(!C.demo)try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};save();
const left=()=>Math.max(0,S.paused!=null?S.paused:S.end-Date.now());
function add(ms){
  let r=left()+ms; if(C.max>0)r=Math.min(r,C.max*60000); r=Math.max(0,r);
  if(S.paused!=null)S.paused=r;else S.end=Date.now()+r; save();
  box.classList.remove('flash');void box.offsetWidth;box.classList.add('flash');
}
const setLeft=ms=>{if(S.paused!=null)S.paused=ms;else S.end=Date.now()+ms;save()};
const pad=n=>String(n).padStart(2,'0');
function draw(){
  const r=left(),s=Math.ceil(r/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  $('#clk').innerHTML=`<span class="u">${pad(h)}</span><span class="c">:</span><span class="u">${pad(m)}</span><span class="c">:</span><span class="u">${pad(ss)}</span>`;
  box.classList.toggle('paused',S.paused!=null);box.classList.toggle('ended',r<=0);
}
setInterval(draw,250);draw();

/* ===== linha que roda: regras e desafios (uma coisa por vez, pra não poluir) ===== */
function infoItems(){const L=[];
  if(C.ir&&C.lay==='b')RULES.forEach(r=>L.push(`<span class="k" style="--kc:var(--teal)">REGRA</span><span class="t">${r[0]} = <span class="v" style="--vc:var(--orange)">${mtxt(r[1])}</span></span>`));
  if(C.ic)CH.forEach((c,i)=>{if(!c[0])return;const tag=c[1]>0?`<span class="v" style="--vc:var(--cash)">${brl(c[1])}</span> → `:'';const tm=c[2]?` <span class="v" style="--vc:var(--orange)">(${c[2]>0?'+':''}${c[2]} min)</span>`:'';
    L.push(`<span class="k" style="--kc:var(--gold)">DESAFIO ${i+1}</span><span class="t">${tag}${esc(c[0])}${tm}</span>`)});
  return L}
let ii=0;
function nextInfo(){const L=infoItems(),el=$('#info');if(!el)return;
  if(!L.length){el.style.display='none';return}el.style.display='';
  const old=el.querySelector('.it:not(.out)');if(old){old.classList.add('out');setTimeout(()=>old.remove(),400)}
  const n=document.createElement('div');n.className='it';n.innerHTML=L[ii++%L.length];el.appendChild(n)}
nextInfo();setInterval(nextInfo,7000);

/* ===== avisos de +tempo e de desafio ===== */
function pop(min,name,what,color){
  const p=document.createElement('div');p.className='pop';p.style.setProperty('--pc',color||'var(--cash)');
  p.innerHTML=`<span class="p">${min>=0?'+':'−'}${fmtMin(Math.abs(min))}</span><span class="n">${esc(name||'')}</span><span class="d">${esc(what||'')}</span>`;
  const ps=$('#pops');ps.appendChild(p);while(ps.children.length>3)ps.firstElementChild.remove();setTimeout(()=>p.remove(),5200)}
function fmtMin(m){const s=Math.round(m*60),h=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;return h?`${h}:${pad(mm)}:${pad(ss)}`:`${mm}:${pad(ss)}`}
let banT=null;
function banner(i,who){const c=CH[i];if(!c)return;$('#banT').innerHTML=(who?`<b>${esc(who)}</b> ativou: `:'')+esc(c[0])+(c[2]?` <b>(${c[2]>0?'+':''}${c[2]} min)</b>`:'');
  const b=$('#ban');b.classList.remove('on');void b.offsetWidth;b.classList.add('on');clearTimeout(banT);banT=setTimeout(()=>b.classList.remove('on'),9000)}

/* ===== regras: o que cada coisa vale ===== */
const TIER={1000:1,2000:2,3000:5,Prime:1};
function onSub(name,plan,count){const m=C.sub*(TIER[plan]||1)*(count||1);if(m>0){add(m*60000);pop(m,name,count>1?`${count} subs`:'sub','var(--teal)')}}
function onGift(name,count,plan){const m=C.gift*(TIER[plan]||1)*count;if(m>0){add(m*60000);pop(m,name,`gift ×${count}`,'var(--gold)')}}
function onBits(name,bits){const m=C.bits*bits/100;if(m>0){add(m*60000);pop(m,name,bits+' bits','var(--cash)')}}
function onDonate(name,amount){const m=C.dv>0?C.dm*amount/C.dv:0;if(m>0){add(m*60000);pop(m,name,brl(amount),'var(--cash)')}
  // desafio por valor: o maior desafio que o valor alcança
  let best=-1;CH.forEach((c,i)=>{if(c[1]>0&&amount>=c[1]&&(best<0||c[1]>CH[best][1]))best=i});if(best>=0)banner(best,name)}

/* ===== comandos no chat (só o Meikod e os mods) =====
   !tempo +10   !tempo -5   !tempo =90 (deixa 90 min)   !pausar   !continuar   !d 2 (ativa o desafio 2) */
function cmd(text,name){const a=text.trim().split(/\s+/),c=a[0].toLowerCase();
  if(c==='!tempo'&&a[1]){const v=a[1];const n=parseFloat(v.replace(/^[+=-]/,'').replace(',','.'));if(isNaN(n))return;
    if(v[0]==='=')setLeft(n*60000);else{const m=v[0]==='-'?-n:n;add(m*60000);pop(m,name,'ajuste','var(--pink)')}}
  else if(c==='!pausar'&&S.paused==null){S.paused=left();save()}
  else if(c==='!continuar'&&S.paused!=null){S.end=Date.now()+S.paused;S.paused=null;save()}
  else if(c==='!d'&&a[1]){const i=parseInt(a[1])-1;const ch=CH[i];if(!ch)return;banner(i,'');if(ch[2]){add(ch[2]*60000);pop(ch[2],'Desafio '+(i+1),'','var(--gold)')}}
}

/* ===== conexão com a Twitch (sem login) ===== */
function parseIRC(line){const m={tags:{},prefix:'',cmd:'',trail:''};let s=line;
  if(s[0]==='@'){const i=s.indexOf(' ');for(const kv of s.slice(1,i).split(';')){const j=kv.indexOf('=');m.tags[kv.slice(0,j)]=kv.slice(j+1).replace(/\\s/g,' ')}s=s.slice(i+1)}
  if(s[0]===':'){const i=s.indexOf(' ');m.prefix=s.slice(1,i);s=s.slice(i+1)}
  const ti=s.indexOf(' :');if(ti>=0){m.trail=s.slice(ti+2);s=s.slice(0,ti)}m.cmd=s.split(' ')[0];return m}
const gifted={};
function onIRC(m){const t=m.tags,user=(m.prefix.split('!')[0]||'').toLowerCase(),nm=t['display-name']||user;
  if(m.cmd==='PRIVMSG'){
    if(t.bits&&+t.bits>0)onBits(nm,+t.bits);
    const b=t.badges||'';if(m.trail.startsWith('!')&&/broadcaster\/|moderator\//.test(b))cmd(m.trail,nm);
  }else if(m.cmd==='USERNOTICE'){const id=t['msg-id'],plan=t['msg-param-sub-plan'];
    if(id==='sub'||id==='resub')onSub(nm,plan,1);
    else if(id==='submysterygift'){const c=+t['msg-param-mass-gift-count']||1;gifted[user]=(gifted[user]||0)+c;onGift(nm,c,plan)}
    else if(id==='subgift'){if(gifted[user]>0){gifted[user]--;return}onGift(nm,1,plan)}}}
function twitch(){const ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+(10000+Math.floor(Math.random()*89999)));ws.send('JOIN #'+C.canal)};
  ws.onmessage=e=>{for(const l of e.data.split('\r\n')){if(!l)continue;if(l.startsWith('PING')){ws.send('PONG :tmi.twitch.tv');continue}try{onIRC(parseIRC(l))}catch(x){}}};
  ws.onclose=()=>setTimeout(twitch,3000)}
/* doações pelo Streamlabs (opcional, com o token) */
function streamlabs(){const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.5.0/socket.io.min.js';
  sc.onload=()=>{const io_=window.io('https://sockets.streamlabs.com?token='+encodeURIComponent(C.tk),{transports:['websocket']});
    io_.on('event',ev=>{if(ev.type!=='donation')return;for(const x of [].concat(ev.message||[]))onDonate(x.from||x.name,+x.amount||0)})};
  document.head.appendChild(sc)}

if(C.demo){ // prévia no painel: simula eventos
  const N=['LeoDaVice','Tilia_','ze_do_corre','PaulinhaDrift','Vitao_RJ','neon_kid'],pk=a=>a[Math.floor(Math.random()*a.length)];
  const ev=[()=>onSub(pk(N),'1000',1),()=>onGift(pk(N),pk([1,5]),'1000'),()=>onBits(pk(N),pk([100,500])),()=>onDonate(pk(N),pk([10,20,50,100]))];
  let n=0;setInterval(()=>{ev[n++%ev.length]()},3800);
}else{twitch();if(C.tk)streamlabs()}
</script>
</body>
</html>
